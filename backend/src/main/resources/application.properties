spring.application.name=talentomdd-backend

# Perfil activo por defecto (se puede sobrescribir con -Dspring.profiles.active=dev)
spring.profiles.active=dev

# Datasource (se completa via variables de entorno, ver .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentomdd}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# IMPORTANTE: nunca usar "create" en un entorno compartido.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_IN_ENV_MIN_32_CHARS_LONG}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - origen real del frontend (ajustar cuando Alexandro defina el dominio/puerto)
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
